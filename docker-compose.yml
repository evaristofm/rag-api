services:
  ollama:
    image: ollama/ollama:latest
    ports:
      - '11434:11434'
    volumes:
      - ollama_data:/root/.ollama

  api:
    build: .
    ports:
      - '8000:8000'
    environment:
      OLLAMA_URL: http://ollama:11434
    volumes:
      - ./chroma_db:/app/chroma_db
    depends_on:
      - ollama

volumes:
  ollama_data:
